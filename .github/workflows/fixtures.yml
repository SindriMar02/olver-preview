# Lives on the gh-pages branch of SindriMar02/olver-preview (deployed by deploy.sh).
# Re-reads Ölver's own fixture list (sportbarinn.is/boltinn) so the preview always shows tonight's match.
name: fixtures
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: fixtures, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/fetch-fixtures.mjs
      - run: |
          git diff --quiet data/fixtures.json && exit 0
          git config user.name "fixtures-bot"; git config user.email "sindrimar02@gmail.com"
          git add data/fixtures.json && git commit -m "fixtures $(date -u +%FT%TZ)" && git push
